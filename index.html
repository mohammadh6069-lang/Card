<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>کارت من</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14183A;
    --coral:#FF6B8B;
    --aqua:#4FD1C5;
    --lemon:#FFE27A;
    --mist:#EEF1FF;
    --rx:0deg; --ry:0deg; --mx:50%; --my:50%;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Vazirmatn',system-ui,-apple-system,sans-serif;
    background:linear-gradient(160deg,#2A2D78 0%,#191C4D 55%,#14183A 100%);
    color:#fff;
    min-height:100dvh;
    display:grid;
    place-items:center;
    padding:24px 0 96px;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  /* پس‌زمینه: لکه‌های رنگی نرم (بدون filter تا روی همه گوشی‌ها تمیز رندر بشه) */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden}
  .bg i{position:absolute;border-radius:50%}
  .b1{width:120vmin;height:120vmin;top:-34vmin;right:-40vmin;background:radial-gradient(circle,rgba(255,107,139,.95) 0%,rgba(255,107,139,0) 68%)}
  .b2{width:130vmin;height:130vmin;bottom:-40vmin;left:-46vmin;background:radial-gradient(circle,rgba(79,209,197,.9) 0%,rgba(79,209,197,0) 68%)}
  .b3{width:90vmin;height:90vmin;top:36%;right:-34vmin;background:radial-gradient(circle,rgba(124,92,255,.85) 0%,rgba(124,92,255,0) 68%)}

  .scene{position:relative;z-index:1;perspective:1000px;width:min(84vw,340px)}

  /* دو شکل تیز پشت شیشه، تا جلوه مات‌شدن شیشه معلوم باشه */
  .orb,.ring{position:absolute;z-index:0;pointer-events:none}
  .orb{
    width:124px;height:124px;border-radius:50%;
    top:-40px;left:-34px;
    background:linear-gradient(135deg,var(--lemon),var(--coral));
    box-shadow:0 18px 30px -10px rgba(8,10,40,.5);
  }
  .ring{
    width:150px;height:150px;border-radius:50%;
    bottom:-46px;right:-36px;
    border:16px solid var(--aqua);
    box-shadow:0 18px 30px -10px rgba(8,10,40,.4);
  }

  .card{
    position:relative;z-index:1;
    aspect-ratio:5/7;
    transform-style:preserve-3d;
    transform:rotateX(var(--rx)) rotateY(var(--ry));
    transition:transform .12s linear;
  }

  /* خود شیشه */
  .glass{
    position:absolute;inset:0;
    border-radius:30px;
    overflow:hidden;
    background:
      linear-gradient(145deg,rgba(255,255,255,.34),rgba(255,255,255,.08) 60%),
      rgba(30,34,100,.14);
    border:1px solid rgba(255,255,255,.55);
    -webkit-backdrop-filter:blur(20px) saturate(170%);
    backdrop-filter:blur(20px) saturate(170%);
    box-shadow:
      0 30px 60px -22px rgba(8,10,40,.6),
      inset 0 1.5px 0 rgba(255,255,255,.7),
      inset 0 -1px 0 rgba(255,255,255,.18);
  }
  /* بازتاب نور که دنبال انگشت می‌آد */
  .shine{
    position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.42),rgba(255,255,255,0) 52%),
      linear-gradient(115deg,transparent 24%,rgba(255,226,122,.26) 40%,rgba(79,209,197,.26) 52%,rgba(255,107,139,.26) 64%,transparent 78%);
    background-size:100% 100%,260% 260%;
    background-position:0 0,var(--mx) var(--my);
    background-repeat:no-repeat;
  }

  /* محتوا جدا از شیشه، تا عمق سه‌بعدی کار کنه */
  .content{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:28px 24px;text-align:center;
    text-shadow:0 2px 14px rgba(10,12,50,.5);
  }

  .avatar{
    width:104px;height:104px;border-radius:50%;
    display:grid;place-items:center;
    font-size:44px;font-weight:800;color:var(--ink);
    background:linear-gradient(135deg,var(--lemon),var(--coral));
    border:3px solid rgba(255,255,255,.85);
    overflow:hidden;
    transform:translateZ(60px);
    box-shadow:0 16px 28px -10px rgba(8,10,40,.6);
    text-shadow:none;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}

  h1{font-size:28px;font-weight:800;line-height:1.35;transform:translateZ(46px)}
  .title{font-size:15px;font-weight:600;color:#FFF1B8;transform:translateZ(34px)}
  .bio{font-size:14px;line-height:1.9;max-width:26ch;color:rgba(255,255,255,.95);transform:translateZ(26px)}

  .links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px;transform:translateZ(40px)}
  .links a{
    display:inline-block;text-decoration:none;font:inherit;font-size:13px;font-weight:600;
    color:var(--ink);background:rgba(255,255,255,.9);
    border:0;border-radius:999px;padding:9px 18px;cursor:pointer;
    box-shadow:0 8px 16px -8px rgba(8,10,40,.5);
    text-shadow:none;
    transition:transform .15s ease;
  }
  .links a:active{transform:scale(.94)}
  .links a:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}

  #gyro{
    position:fixed;z-index:2;top:14px;left:14px;
    font:inherit;font-size:12px;font-weight:600;
    color:var(--ink);background:rgba(255,255,255,.9);
    border:0;border-radius:999px;padding:6px 12px;display:none;cursor:pointer;
  }
  #gyro:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}

  @media (prefers-reduced-motion:reduce){
    .card{transition:none}
  }
</style>
</head>
