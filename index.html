<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>کارت من</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0A;
    --gold:#D4AF37;
    --gold-hi:#F3DE8A;
    --gold-lo:#8C6B1A;
    --rx:0deg; --ry:0deg; --mx:50%; --my:50%;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Vazirmatn',system-ui,-apple-system,sans-serif;
    background:#0A0A0A;
    color:#fff;
    min-height:100dvh;
    display:grid;
    place-items:center;
    padding:24px 0 96px;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  .bg{position:fixed;inset:0;z-index:0;overflow:hidden}
  .bg i{position:absolute;border-radius:50%}
  .b1{width:120vmin;height:120vmin;top:-38vmin;right:-44vmin;background:radial-gradient(circle,rgba(255,255,255,.30) 0%,rgba(255,255,255,0) 66%)}
  .b2{width:130vmin;height:130vmin;bottom:-46vmin;left:-50vmin;background:radial-gradient(circle,rgba(255,255,255,.20) 0%,rgba(255,255,255,0) 66%)}
  .b3{width:90vmin;height:90vmin;top:38%;right:-36vmin;background:radial-gradient(circle,rgba(212,175,55,.30) 0%,rgba(212,175,55,0) 66%)}

  .scene{position:relative;z-index:1;perspective:1000px;width:min(84vw,340px)}

  .orb,.ring{position:absolute;z-index:0;pointer-events:none}
  .orb{
    width:124px;height:124px;border-radius:50%;
    top:-40px;left:-34px;
    background:linear-gradient(135deg,#FFFFFF,#8B8B8B);
    box-shadow:0 18px 30px -10px rgba(0,0,0,.8);
  }
  .ring{
    width:150px;height:150px;border-radius:50%;
    bottom:-46px;right:-36px;
    border:16px solid var(--gold);
    box-shadow:0 18px 30px -10px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.25);
  }

  .card{
    position:relative;z-index:1;
    aspect-ratio:5/7;
    transform-style:preserve-3d;
    transform:rotateX(var(--rx)) rotateY(var(--ry));
    transition:transform .12s linear;
  }

  .glass{
    position:absolute;inset:0;
    border-radius:30px;
    overflow:hidden;
    background:
      linear-gradient(145deg,rgba(255,255,255,.20),rgba(255,255,255,.03) 60%),
      rgba(0,0,0,.38);
    border:1.5px solid var(--gold);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    backdrop-filter:blur(18px) saturate(140%);
    box-shadow:
      0 30px 60px -22px rgba(0,0,0,.9),
      0 0 26px -8px rgba(212,175,55,.45),
      inset 0 1.5px 0 rgba(243,222,138,.6),
      inset 0 0 0 1px rgba(0,0,0,.45);
  }
  .glass::before{
    content:"";position:absolute;inset:8px;border-radius:23px;
    border:1px solid rgba(212,175,55,.38);
    pointer-events:none;
  }
  .shine{
    position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.30),rgba(255,255,255,0) 52%),
      linear-gradient(115deg,transparent 28%,rgba(243,222,138,.20) 46%,rgba(255,255,255,.16) 54%,transparent 72%);
    background-size:100% 100%,260% 260%;
    background-position:0 0,var(--mx) var(--my);
    background-repeat:no-repeat;
  }

  .content{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:28px 24px;text-align:center;
    text-shadow:0 2px 14px rgba(0,0,0,.7);
  }

  .avatar{
    width:104px;height:104px;border-radius:50%;
    display:grid;place-items:center;
    font-size:44px;font-weight:800;color:var(--ink);
    background:linear-gradient(135deg,var(--gold-hi),var(--gold-lo));
    border:2px solid var(--gold);
    overflow:visible;
    transform:translateZ(60px);
    box-shadow:
      0 0 0 5px rgba(0,0,0,.6),
      0 0 0 6.5px rgba(212,175,55,.75),
      0 18px 30px -10px rgba(0,0,0,.85);
    text-shadow:none;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}

  h1{font-size:28px;font-weight:800;line-height:1.35;color:#fff;transform:translateZ(46px);margin-top:6px}
  .title{font-size:15px;font-weight:600;color:var(--gold-hi);transform:translateZ(34px)}
  .bio{font-size:14px;line-height:1.9;max-width:26ch;color:rgba(255,255,255,.88);transform:translateZ(26px)}

  .links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px;transform:translateZ(40px)}
  .links a{
    display:inline-block;text-decoration:none;font:inherit;
    font-size:13px;font-weight:600;
    color:#0A0A0A;background:#fff;
    border:1.5px solid var(--gold);border-radius:999px;padding:8px 18px;cursor:pointer;
    box-shadow:0 8px 16px -8px rgba(0,0,0,.8), 0 0 14px -4px rgba(212,175,55,.5);
    text-shadow:none;
    transition:transform .15s ease;
  }
  .links a:active{transform:scale(.94)}
  .links a:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}

  #gyro{
    position:fixed;z-index:2;top:14px;left:14px;
    font:inherit;font-size:12px;font-weight:600;
    color:#0A0A0A;background:#fff;border:1.5px solid var(--gold);
    border-radius:999px;padding:6px 12px;display:none;cursor:pointer;
  }
  #gyro:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}

  @media (prefers-reduced-motion:reduce){
    .card{transition:none}
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
  <button id="gyro" type="button">فعال‌سازی حرکت گوشی</button>

  <div class="scene">
    <span class="orb" aria-hidden="true"></span>
    <span class="ring" aria-hidden="true"></span>
    <main class="card" id="card">
      <div class="glass"><div class="shine"></div></div>
      <div class="content">
        <div class="avatar" id="avatar"><img src="me.jpg" alt="ممـ𝆭د"></div>
        <h1 id="name">ممـ𝆭د</h1>
        <p class="title" id="title">مهندسی ساخت و تولید</p>
        <p class="bio" id="bio">۲۰ ساله از بیرجند</p>
        <div class="links" id="links">
          <a href="https://t.me/Dark_RoseSoul" target="_blank" rel="noopener">کانال تلگرام</a>
          <a href="https://instagram.com/25.00.71" target="_blank" rel="noopener">اینستاگرام</a>
        </div>
      </div>
    </main>
  </div>

<script>
const CONFIG = {
  name:  "ممـ𝆭د",
  title: "مهندسی ساخت و تولید",
  city:  "بیرجند",
  birth: { y: 1385, m: 5, d: 31 },
  mainButton: { text: "ورود به کانال", url: "https://t.me/Dark_RoseSoul" },
  links: [
    { label: "کانال تلگرام", url: "https://t.me/Dark_RoseSoul" },
    { label: "اینستاگرام",   url: "https://instagram.com/25.00.71" }
  ]
};

function jalaliAge(b) {
  const p = new Intl.DateTimeFormat('en-u-ca-persian-nu-latn', { year: 'numeric', month: 'numeric', day: 'numeric' })
    .formatToParts(new Date())
    .reduce((o, x) => (o[x.type] = x.value, o), {});
  const y = +p.year, m = +p.month, d = +p.day;
  let age = y - b.y;
  if (m < b.m || (m === b.m && d < b.d)) age -= 1;
  return age;
}

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('#0A0A0A'); tg.setBackgroundColor('#0A0A0A'); } catch (e) {}
}

const $ = (id) => document.getElementById(id);
try {
  $('bio').textContent = jalaliAge(CONFIG.birth).toLocaleString('fa-IR') + ' ساله از ' + CONFIG.city;
} catch (e) {}

function openUrl(url) {
  if (tg) {
    if (/^https:\/\/t\.me\//.test(url)) tg.openTelegramLink(url);
    else tg.openLink(url);
  } else {
    window.open(url, '_blank', 'noopener');
  }
}

document.querySelectorAll('#links a').forEach((a) => {
  a.addEventListener('click', (e) => {
    if (tg) { e.preventDefault(); openUrl(a.href); }
  });
});

if (tg && CONFIG.mainButton) {
  tg.MainButton.setParams({ text: CONFIG.mainButton.text, color: '#D4AF37', text_color: '#0A0A0A' });
  tg.MainButton.onClick(() => openUrl(CONFIG.mainButton.url));
  tg.MainButton.show();
}

const card = $('card');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
let interacted = false;
let dragging = false;

function setTilt(nx, ny) {
  card.style.setProperty('--rx', (-ny * 12).toFixed(2) + 'deg');
  card.style.setProperty('--ry', (nx * 12).toFixed(2) + 'deg');
  card.style.setProperty('--mx', (((nx + 1) / 2) * 100).toFixed(1) + '%');
  card.style.setProperty('--my', (((ny + 1) / 2) * 100).toFixed(1) + '%');
}

function fromPointer(e) {
  const r = card.getBoundingClientRect();
  const nx = clamp(((e.clientX - r.left) / r.width) * 2 - 1, -1, 1);
  const ny = clamp(((e.clientY - r.top) / r.height) * 2 - 1, -1, 1);
  setTilt(nx, ny);
}

window.addEventListener('pointerdown', (e) => {
  interacted = true; dragging = true;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  fromPointer(e);
});
window.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'mouse' || dragging) { interacted = true; fromPointer(e); }
});
window.addEventListener('pointerup',     () => { dragging = false; if (!gyroOn) setTilt(0, 0); });
window.addEventListener('pointercancel', () => { dragging = false; if (!gyroOn) setTilt(0, 0); });

let gyroOn = false;
function onOrient(e) {
  if (e.gamma == null || e.beta == null) return;
  gyroOn = true; interacted = true;
  if (dragging) return;
  setTilt(clamp(e.gamma / 25, -1, 1), clamp((e.beta - 45) / 25, -1, 1));
}
const gyroBtn = $('gyro');
if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
  gyroBtn.style.display = 'block';
  gyroBtn.addEventListener('click', async () => {
    try {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res === 'granted') {
        window.addEventListener('deviceorientation', onOrient);
        gyroBtn.style.display = 'none';
      }
    } catch (err) { console.error(err); }
  });
} else {
  window.addEventListener('deviceorientation', onOrient);
}

const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!reduce) {
  const start = performance.now();
  (function idle(now) {
    if (interacted) return;
    const t = now - start;
    setTilt(Math.sin(t / 900) * 0.55, Math.cos(t / 1200) * 0.35);
    requestAnimationFrame(idle);
  })(start);
}
</script>
</body>
</html>
